<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>QA Demo Shop — Connexion</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-box">
    <h2>QA Demo Shop</h2>
    <div id="error-slot"></div>
    <input id="user-name" placeholder="Nom d'utilisateur" autocomplete="off" />
    <input id="password" type="password" placeholder="Mot de passe" autocomplete="off" />
    <button id="login-button">Se connecter</button>
    <p style="font-size:12px;color:#888;margin-top:14px;">Utilisateurs de test : <code>standard_user</code> / <code>locked_out_user</code> — mot de passe <code>secret_sauce</code></p>
  </div>
  <script src="data.js"></script>
  <script>
    const USERS = {
      standard_user: { password: 'secret_sauce', locked: false },
      locked_out_user: { password: 'secret_sauce', locked: true },
    };

    document.getElementById('login-button').addEventListener('click', () => {
      const username = document.getElementById('user-name').value.trim();
      const password = document.getElementById('password').value;
      const errorSlot = document.getElementById('error-slot');
      errorSlot.innerHTML = '';

      const user = USERS[username];
      if (!user || user.password !== password) {
        errorSlot.innerHTML = '<div data-test="error">Epic sadface: Username and password do not match any user in this service.</div>';
        return;
      }
      if (user.locked) {
        errorSlot.innerHTML = '<div data-test="error">Epic sadface: Sorry, this user has been locked out.</div>';
        return;
      }
      sessionStorage.setItem('qa_demo_user', username);
      sessionStorage.setItem('qa_demo_cart', JSON.stringify([]));
      window.location.href = 'inventory.html';
    });
  </script>
</body>
</html>
