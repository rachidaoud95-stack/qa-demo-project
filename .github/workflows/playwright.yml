name: Tests de régression (Playwright)

# Ce pipeline tourne à chaque push et à chaque pull request : toute
# régression sur les parcours critiques (login, panier, paiement, tri)
# est détectée avant la mise en production, pas après.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - name: Lancer la suite de tests
        run: npx playwright test

      - name: Publier le rapport HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
